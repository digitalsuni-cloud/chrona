<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark rounded background -->
  <rect width="32" height="32" rx="7" fill="#0c0f17"/>

  <!-- Globe outer circle -->
  <circle cx="16" cy="16" r="12" stroke="#38bdf8" stroke-width="1.5" fill="none"/>

  <!-- Equator -->
  <line x1="4" y1="16" x2="28" y2="16" stroke="#38bdf8" stroke-width="1" stroke-linecap="round"/>

  <!-- Central vertical meridian (ellipse) -->
  <ellipse cx="16" cy="16" rx="5" ry="12" stroke="#38bdf8" stroke-width="1" fill="none"/>

  <!-- Upper latitude line -->
  <path d="M 6.3 10 Q 16 7 25.7 10" stroke="#38bdf8" stroke-width="1" fill="none" stroke-linecap="round"/>

  <!-- Lower latitude line -->
  <path d="M 6.3 22 Q 16 25 25.7 22" stroke="#38bdf8" stroke-width="1" fill="none" stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="16" cy="16" r="1.5" fill="#38bdf8"/>
</svg>
